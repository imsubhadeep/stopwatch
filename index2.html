<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="Tailwind/browser@4.js"></script>
</head>
<body class="bg-[#08111f] text-white min-h-screen flex flex-col">
    <header class="w-full flex justify-center items-center">
        <nav class="navbar bg-[#111c2e]/90 h-[50px] w-[80%] m-4 rounded-xl backdrop-blur-xl border border-[#263750] shadow-lg shadow-black/20">
            <ul class="navbarItems px-6 flex gap-10 h-full justify-between items-center">
                <li>
                    <span class="font-semibold tracking-wide">Coding Competition <span class="text-blue-400">2026</span></span>
                </li>

                <li>
                    <div class="flex gap-2 bg-[#1e2b40] rounded-md">
                        <button class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-md transition-colors">Timer</button>
                    </div>
                </li>

                <li class="text-sm text-gray-300">
                    <span id="date"></span>
                    <span class="mx-1 text-gray-500">|</span>
                    <span id="time" class="font-medium text-blue-300"></span>
                </li>
            </ul>
        </nav>
    </header>

    <main class="flex-1 w-full flex flex-col justify-center items-center px-4">
        <div id="container" class="bg-[#111c2e]/90 w-[90%] md:w-[75%] lg:w-[65%] h-[450px] flex justify-center items-center rounded-2xl backdrop-blur-xl border border-[#263750] shadow-2xl shadow-black/30">
            <div id="countdownMode" class="w-full h-full flex flex-col justify-center items-center">
                <div class="flex justify-center items-center">
                    <i class="fa-regular fa-alarm-clock text-[50px] text-blue-400"></i>
                </div>

                <div class="flex justify-center items-center mt-4">
                    <span class="tracking-[10px] text-gray-400 text-sm font-medium">TIMER</span>
                </div>

                <div class="flex justify-center items-center w-full px-4">
                    <div id="countdownDisplay" class="text-[clamp(3.5rem,8vw,7rem)] my-8 font-['JetBrains_Mono'] font-bold tracking-wider text-white leading-tight tabular-nums">00:00:00</div>
                </div>

                <div class="buttonsArea w-full flex flex-wrap gap-4 justify-center items-center px-4 py-5">
                    <button id="startBtn" class="text-white bg-blue-600 hover:bg-blue-500 w-[100px] h-12 rounded-lg transition-colors">Start</button>
                    <button id="stopBtn" class="text-white bg-[#263750] hover:bg-red-600 w-[100px] h-12 rounded-lg transition-colors">Stop</button>
                    <button id="setBtn" class="text-white bg-[#263750] hover:bg-blue-600 w-[100px] h-12 rounded-lg transition-colors">Set</button>
                    <input type="text" id="numInput" min="1" placeholder="Minutes" class="hidden w-[100px] h-12 bg-[#0b1525] text-white placeholder-gray-500 border border-[#334766] border-b-blue-400 text-center rounded-md outline-none focus:ring-2 focus:ring-blue-500">
                    <button id="countdownBtn" class="hidden text-[30px] text-blue-400 hover:text-blue-300 relative bottom-1" aria-label="Set countdown">→</button>
                </div>
            </div>
        </div>
    </main>

    <footer class="w-full flex justify-center items-center">
        <div class="bg-[#111c2e]/90 text-gray-400 text-sm w-[80%] h-[40px] flex justify-center items-center mb-4 rounded-xl backdrop-blur-xl border border-[#263750]">
            Copyright © 2026 · CCLMS
        </div>
    </footer>

    <script src="javascript/script.js"></script>
</body>
</html>
